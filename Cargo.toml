[package]
name = "osc52"
version = "0.2.0"
edition = "2024"
description = "Copy text to the system clipboard through the terminal with OSC 52"
license = "MIT"
repository = "https://github.com/moncho/osc52"

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
strip = true
lto = true
codegen-units = 1
